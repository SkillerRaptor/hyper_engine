name: build

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  build:
    name: ${{matrix.os}} ${{matrix.compiler}} ${{matrix.build_type}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        compiler:
          - llvm
          - gcc
        build_type:
          - Release
          - Debug
        generator:
          - "Ninja Multi-Config"
        exclude:
          - os: windows-latest
            compiler: gcc
        include:
          - os: windows-latest
            compiler: msvc
            generator: "Visual Studio 17 2022"
            build_type: Debug
          - os: windows-latest
            compiler: msvc
            generator: "Visual Studio 17 2022"
            build_type: Release
    steps:
      - uses: actions/checkout@v6

      - name: Update environment
        if: runner.os != 'Windows'
        run: |
          sudo apt update -qq
          sudo apt install -y \
            libgl1-mesa-dev \
            xorg-dev

      - name: Setup Cache
        uses: ./.github/actions/setup_cache
        with:
          compiler: ${{ matrix.compiler }}
          build_type: ${{ matrix.build_type }}
          generator: ${{ matrix.generator }}

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
          ninja: true
          ccache: true

      - name: Prepare Vulkan SDK
        uses: humbletim/install-vulkan-sdk@033219e2d69dd4d3e873e217eb385fdd4b4438f4
        with:
          version: latest
          cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B ./build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE:STRING=${{ matrix.build_type }}

      - name: Build
        run: |
          cmake --build ./build --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ./build
        run: |
          ctest -C ${{ matrix.build_type }}

      - name: Prepare upload
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            tar cfz ${{ matrix.config.artifact }} build
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            7z a -tzip ${{ matrix.config.artifact }} build/*
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          path: ${{ matrix.config.artifact }}
          name: ${{ matrix.config.artifact }}