name: build

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  build:
    name: ${{matrix.os}} ${{matrix.compiler}} ${{matrix.build_type}}
    runs-on: ${{ matrix.os }}
    env:
      vulkan_sdk: "${{ github.workspace }}/vulkan_sdk/"
      vulkan_version: "1.4.341.1"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        compiler:
          - llvm
          - gcc
        build_type:
          - Release
          - Debug
        generator:
          - "Ninja Multi-Config"
        exclude:
          - os: windows-latest
            compiler: gcc
        include:
          - os: windows-latest
            compiler: msvc
            generator: "Visual Studio 17 2022"
            build_type: Debug
          - os: windows-latest
            compiler: msvc
            generator: "Visual Studio 17 2022"
            build_type: Release
    steps:
      - uses: actions/checkout@v6

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
          ninja: true

      - name: Unix -Install Vulkan SDK
        if: runner.os != 'Windows'
        run: |
          curl -LS -o vulkansdk.tar.gz https://sdk.lunarg.com/sdk/download/${{ env.vulkan_version }}/linux/vulkansdk-linux-x86_64-${{ env.vulkan_version }}.tar.gz

          mkdir "${{ env.vulkan_sdk }}"
          tar xfz vulkansdk.tar.gz -C "${{ env.vulkan_sdk }}"
          
          export VULKAN_SDK="${{ env.vulkan_sdk }}/${{ env.vulkan_version }}/x86_64"
          export PATH=$PATH:$VULKAN_SDK/bin
          export LD_LIBRARY_PATH=$VULKAN_SDK/lib:$LD_LIBRARY_PATH
          export VK_LAYER_PATH=$VULKAN_SDK/etc/explicit_layer.d

      - name: Windows - Install Vulkan SDK
        if: runner.os == 'Windows'
        run: |
          curl -LS -o vulkansdk.exe https://sdk.lunarg.com/sdk/download/${{ env.vulkan_version }}/windows/VulkanSDK-${{ env.vulkan_version }}-Installer.exe?Human=true
          7z x vulkansdk.exe -o"${{ env.vulkan_sdk }}"
          
          set PATH=%PATH%;${{ env.vulkan_sdk }}\;${{ env.vulkan_sdk }}\Bin\

      - name: Configure CMake
        run: |
          cmake -S . -B ./build -G "${{matrix.generator}}" -DCMAKE_BUILD_TYPE:STRING=${{matrix.build_type}}

      - name: Build
        run: |
          cmake --build ./build --config ${{matrix.build_type}}

      - name: Unix - Test
        if: runner.os != 'Windows'
        working-directory: ./build
        run: |
          ctest -C ${{matrix.build_type}}

      - name: Windows - Test
        if: runner.os == 'Windows'
        working-directory: ./build
        run: |
          ctest -C ${{matrix.build_type}}

      - name: Unix - Prepare upload
        if: runner.os != 'Windows'
        run: |
          tar cfz ${{ matrix.config.artifact }} build

      - name: Windows - Prepare upload
        if: runner.os == 'Windows'
        run: |
          7z a -tzip ${{ matrix.config.artifact }} build/*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          path: ${{ matrix.config.artifact }}
          name: ${{ matrix.config.artifact }}